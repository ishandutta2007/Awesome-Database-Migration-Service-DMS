<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Data Stream Line Gradients -->
    <linearGradient id="stream1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Tech Grid (Background) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (DATA PIPELINES & FLOATING PACKETS) -->
  <!-- Animated Data Flow Paths -->
  <path d="M 100,320 C 300,380 400,280 600,340 C 800,400 900,300 1100,330" fill="none" stroke="url(#stream1)" stroke-width="3" opacity="0.6"/>
  <path d="M 50,80 C 250,20 450,120 650,50 C 850,-20 1000,90 1150,60" fill="none" stroke="url(#stream1)" stroke-width="2" opacity="0.4"/>

  <!-- Dynamic Animated Packets along streams -->
  <g filter="url(#glow)">
    <!-- Packet 1 -->
    <circle cx="150" cy="325" r="5" fill="#38bdf8">
      <animate attributeName="cx" values="100;1100;100" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="320;330;320" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Packet 2 -->
    <circle cx="900" cy="65" r="4" fill="#c084fc">
      <animate attributeName="cx" values="1150;50;1150" dur="15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Side: Source Database Graphic (Background Layer) -->
  <g opacity="0.25" transform="translate(80, 140)">
    <ellipse cx="60" cy="20" rx="45" ry="15" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 15,20 L 15,80 C 15,95 105,95 105,80 L 105,20" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 15,50 C 15,65 105,65 105,50" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Right Side: Target Cloud / Database Graphic (Background Layer) -->
  <g opacity="0.25" transform="translate(1020, 140)">
    <ellipse cx="60" cy="20" rx="45" ry="15" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M 15,20 L 15,80 C 15,95 105,95 105,80 L 105,20" fill="none" stroke="#c084fc" stroke-width="3"/>
    <path d="M 15,50 C 15,65 105,65 105,50" fill="none" stroke="#c084fc" stroke-width="3"/>
  </g>

  <!-- Dynamic Migration Arrow Connecting Left & Right (Behind Text) -->
  <g opacity="0.3" filter="url(#glow)">
    <path d="M 220,180 L 980,180" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="12 8">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <polygon points="975,172 995,180 975,188" fill="#c084fc"/>
  </g>

  <!-- FOREGROUND CONTENT: CLEAR TEXT & BADGES (Guaranteed readable, never hidden) -->

  <!-- Top Pill / Badge -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      🔄 DATA REPLICATION &amp; CDC ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Awesome Database Migration Service
  </text>

  <!-- Gradient Subtitle / Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)" letter-spacing="0.5">
    Homogeneous &amp; Heterogeneous Migration • CDC • Continuous Replication
  </text>

  <!-- Feature Tags / Chips Row -->
  <g transform="translate(600, 265)">
    <!-- Tag 1: AWS / GCP / Azure -->
    <g transform="translate(-270, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        ☁️ Cloud DMS Services
      </text>
    </g>
    <!-- Tag 2: Open-Source CDC -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        ⚡ Open-Source CDC &amp; ELT
      </text>
    </g>
    <!-- Tag 3: Zero-Downtime -->
    <g transform="translate(270, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
        🚀 Zero-Downtime Sync
      </text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="350" y="330" width="500" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8"/>
</svg>
